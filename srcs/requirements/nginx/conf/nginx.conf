server {
	    # Écoute uniquement sur le port 443 avec SSL/TLS
	    listen 443 ssl;
	        listen [::]:443 ssl;

		    server_name jcrochet.42.fr;

		        # Certificats SSL générés dans le Dockerfile
		        ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
			    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

			        # Protocoles TLS v1.2 et v1.3 STRICTEMENT autorisés
			        ssl_protocols TLSv1.2 TLSv1.3;

				    # Racine du site et fichiers d'index
				    root /var/www/wordpress;
				        index index.php index.html;

					    location / {
						            try_files $uri $uri/ /index.php?$args;
							        }

								    # Redirection des requêtes PHP vers WordPress via FastCGI
								    location ~ \.php$ {
									            include fastcgi_params;
										            fastcgi_intercept_errors on;
											            fastcgi_pass wordpress:9000;
												            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
													        }
													}
